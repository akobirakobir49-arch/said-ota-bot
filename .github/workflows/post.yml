name: Kanalga post chiqarish

on:
  schedule:
    # Vaqtlar UTC da. Toshkent = UTC+5 (yozgi vaqt yo'q).
    - cron: "15 3 * * *"    # 08:15 Toshkent -> post 09:00 da chiqadi
    - cron: "15 11 * * *"   # 16:15 Toshkent -> post 17:00 da chiqadi
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi slot"
        required: true
        default: "morning"
        type: choice
        options: [morning, evening]
      publish_at:
        description: "Chiqish vaqti HH:MM (Toshkent). Bo'sh qoldirsangiz — 10 daqiqadan keyin."
        required: false
        default: ""
      dry_run:
        description: "Sinov rejimi (kanalga chiqarmaydi)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: said-ota-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Slot va vaqtni aniqlash
        id: cfg
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_TIME: ${{ inputs.publish_at }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            if [ "$SCHEDULE" = "15 3 * * *" ]; then
              SLOT=morning; TIME=09:00; POLL=6
            else
              SLOT=evening; TIME=17:00; POLL=3
            fi
          else
            SLOT="${IN_SLOT:-morning}"
            if [ "$SLOT" = "morning" ]; then POLL=6; else POLL=3; fi
            if [ -n "$IN_TIME" ]; then
              TIME="$IN_TIME"
            else
              TIME=$(TZ=Asia/Tashkent date -d "+10 minutes" +%H:%M)
            fi
          fi
          echo "slot=$SLOT"   >> "$GITHUB_OUTPUT"
          echo "time=$TIME"   >> "$GITHUB_OUTPUT"
          echo "poll=$POLL"   >> "$GITHUB_OUTPUT"
          echo "Slot=$SLOT, chiqish=$TIME, poll=+${POLL}h"

      - name: Post tayyorlash va chiqarish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python src/publish.py \
            --slot "${{ steps.cfg.outputs.slot }}" \
            --publish-at "${{ steps.cfg.outputs.time }}" \
            --poll-after "${{ steps.cfg.outputs.poll }}" \
            ${{ (inputs.dry_run == true) && '--dry-run' || '' }}

      - name: Holatni saqlash (tarix + poll navbati)
        if: always()
        run: |
          git config user.name  "said-ota-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q."
            exit 0
          fi
          git commit -m "chore: post holati yangilandi (${{ steps.cfg.outputs.slot }})"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push urinishi $i muvaffaqiyatsiz, qayta urinilmoqda..."
            sleep 5
          done
          exit 1
